<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Покупка аккаунтов для тестирования</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body {
      background: radial-gradient(circle at 50% 20%, #2a080c 0%, #0f0d13 100%);
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Эффект Liquid Glass (Жидкое стекло) */
    .card {
      background: rgba(30, 20, 26, 0.55);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-radius: 24px;
      padding: 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 
                  inset 0 1px 1px rgba(255, 255, 255, 0.15),
                  0 0 40px rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(239, 68, 68, 0.08) 0%, transparent 60%);
      pointer-events: none;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 6px;
      text-align: center;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff 0%, #fca5a5 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .sub { color: #94a3b8; font-size: 14px; text-align: center; margin-bottom: 20px; }

    /* Стекло для счетчика остатка */
    .stock-badge {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      text-align: center;
      padding: 10px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
    }

    .tiers {
      background: rgba(15, 13, 19, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #94a3b8;
    }

    .tiers div { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .tiers div:last-child { margin-bottom: 0; }
    .tiers .active { color: #ef4444; font-weight: bold; text-shadow: 0 0 12px rgba(239, 68, 68, 0.5); }

    .form-group { margin-bottom: 20px; }
    label { font-size: 13px; color: #94a3b8; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }

    input[type="number"], input[type="email"] {
      width: 100%;
      height: 48px;
      background: rgba(15, 13, 19, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #fff;
      padding: 0 14px;
      font-size: 15px;
      outline: none;
      transition: 0.3s;
    }

    input[type="number"]:focus, input[type="email"]:focus {
      border-color: #ef4444;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
    }

    .price-info {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      text-align: center;
      padding: 10px;
      border-radius: 12px;
      font-weight: 600;
      margin-bottom: 20px;
      font-size: 14px;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .total { font-size: 18px; font-weight: 700; display: flex; justify-content: space-between; margin-bottom: 24px; }
    .total-val { color: #ef4444; text-shadow: 0 0 10px rgba(239, 68, 68, 0.4); }

    /* Кнопка в стиле Liquid Glass */
    .btn-buy {
      width: 100%;
      height: 52px;
      background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 8px 25px rgba(239, 68, 68, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-buy:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(239, 68, 68, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.4);
    }

    .btn-buy:disabled {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.05);
      color: #64748b;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .error-msg { color: #f87171; font-size: 12px; margin-top: 6px; display: none; }
    
    /* Иконки SVG */
    .icon { width: 18px; height: 18px; fill: currentColor; }
  </style>
</head>
<body>

<div class="card">
  <h1>
    <svg class="icon" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
    Аккаунты для тестирования сервисов
  </h1>
  <p class="sub">Автоматическая выдача сразу после оплаты</p>

  <div class="stock-badge" id="stockBadge">
    <svg class="icon" viewBox="0 0 24 24"><path d="M20 13H4c-.55 0-1 .45-1 1v6c0 .55.45 1 1 1h16c.55 0 1-.45 1-1v-6c0-.55-.45-1-1-1zm-1 5h-2v-2h2v2zm0-8H4c-.55 0-1 .45-1 1v2h18v-2c0-.55-.45-1-1-1zM4 3h16c.55 0 1 .45 1 1v2H3V4c0-.55.45-1 1-1z"/></svg>
    Загрузка остатка...
  </div>

  <div class="tiers">
    <div id="tier1"><span>10 – 99 шт.:</span> <span>25 ₽ / шт.</span></div>
    <div id="tier2"><span>100 – 499 шт.:</span> <span>20 ₽ / шт.</span></div>
    <div id="tier3"><span>от 500 шт.:</span> <span>15 ₽ / шт.</span></div>
  </div>

  <form id="payForm" onsubmit="handlePay(event)">
    <div class="form-group">
      <label>
        <svg class="icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
        Количество аккаунтов (минимум 10)
      </label>
      <input type="number" id="qty" value="10" min="10" oninput="calculatePrice()">
      <div class="error-msg" id="limitError"></div>
    </div>

    <div class="price-info" id="unitPrice">Цена: 25 ₽ за шт.</div>

    <div class="form-group">
      <label>
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
        Ваш Email (туда придут аккаунты)
      </label>
      <input type="email" id="email" placeholder="example@mail.ru" required>
    </div>

    <div class="total">
      <span>Итого к оплате:</span>
      <span id="totalSum" class="total-val">250 ₽</span>
    </div>

    <button type="submit" class="btn-buy" id="submitBtn">
      <svg class="icon" viewBox="0 0 24 24"><path d="M18 6h-2.57c-.2-.59-.57-1.11-1.07-1.48C13.8 4.1 12.93 3.93 12 4c-1.66 0-3 1.34-3 3v1H5c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-7-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 8V7c0-1.66 1.34-3 3-3s3 1.34 3 3v1H9z"/></svg>
      Перейти к оплате
    </button>
  </form>
</div>

<script>
  const PROJECT_ID = "YOUR_PROJECT_ID"; 
  const STOCK_WEBHOOK_URL = "https://hook.eu1.make.com/i98syjddjoqiuwxo5b5p24gmbav5nxwp"; 

  let totalStock = 100; 
  let maxAllowed = Math.floor(totalStock * 0.8);

async function fetchStock() {
  if (STOCK_WEBHOOK_URL && !STOCK_WEBHOOK_URL.includes("ТВОЙ_WEBHOOK")) {
    try {
      // Добавляем timestamp, чтобы браузер не кэшировал запрос
      const response = await fetch(`${STOCK_WEBHOOK_URL}?t=${Date.now()}`);
      const data = await response.json();
      
      if (data && data.stock !== undefined) {
        const parsedStock = parseInt(data.stock, 10);
        if (!isNaN(parsedStock)) {
          totalStock = parsedStock;
        }
      }
    } catch (e) {
      console.error("Ошибка получения остатка:", e);
    }
  }
  
  maxAllowed = Math.floor(totalStock * 0.8);
  const badge = document.getElementById('stockBadge');
  if (badge) {
    badge.innerHTML = `
      <svg class="icon" viewBox="0 0 24 24"><path d="M20 13H4c-.55 0-1 .45-1 1v6c0 .55.45 1 1 1h16c.55 0 1-.45 1-1v-6c0-.55-.45-1-1-1zm-1 5h-2v-2h2v2zm0-8H4c-.55 0-1 .45-1 1v2h18v-2c0-.55-.45-1-1-1zM4 3h16c.55 0 1 .45 1 1v2H3V4c0-.55.45-1 1-1z"/></svg>
      В наличии: ${totalStock} шт. (Макс. заказ: ${maxAllowed} шт.)
    `;
  }
  calculatePrice();
}
  
  maxAllowed = Math.floor(totalStock * 0.8);
  document.getElementById('stockBadge').innerHTML = `
    <svg class="icon" viewBox="0 0 24 24"><path d="M20 13H4c-.55 0-1 .45-1 1v6c0 .55.45 1 1 1h16c.55 0 1-.45 1-1v-6c0-.55-.45-1-1-1zm-1 5h-2v-2h2v2zm0-8H4c-.55 0-1 .45-1 1v2h18v-2c0-.55-.45-1-1-1zM4 3h16c.55 0 1 .45 1 1v2H3V4c0-.55.45-1 1-1z"/></svg>
    В наличии: ${totalStock} шт. (Макс. заказ: ${maxAllowed} шт.)
  `;
  calculatePrice();
}
    
    maxAllowed = Math.floor(totalStock * 0.8);
    document.getElementById('stockBadge').innerHTML = `
      <svg class="icon" viewBox="0 0 24 24"><path d="M20 13H4c-.55 0-1 .45-1 1v6c0 .55.45 1 1 1h16c.55 0 1-.45 1-1v-6c0-.55-.45-1-1-1zm-1 5h-2v-2h2v2zm0-8H4c-.55 0-1 .45-1 1v2h18v-2c0-.55-.45-1-1-1zM4 3h16c.55 0 1 .45 1 1v2H3V4c0-.55.45-1 1-1z"/></svg>
      В наличии: ${totalStock} шт. (Макс. заказ: ${maxAllowed} шт.)
    `;
    calculatePrice();
  }

  function getUnitPrice(qty) {
    if (qty >= 500) return 15;
    if (qty >= 100) return 20;
    return 25;
  }

  function calculatePrice() {
    const qtyInput = document.getElementById('qty');
    const errorEl = document.getElementById('limitError');
    const btn = document.getElementById('submitBtn');
    let qty = parseInt(qtyInput.value) || 0;

    if (qty > maxAllowed) {
      errorEl.innerText = `Нельзя купить больше 80% от остатка (максимум ${maxAllowed} шт.)`;
      errorEl.style.display = 'block';
      btn.disabled = true;
    } else if (qty < 10) {
      errorEl.innerText = `Минимальный заказ — 10 шт.`;
      errorEl.style.display = 'block';
      btn.disabled = true;
    } else {
      errorEl.style.display = 'none';
      btn.disabled = false;
    }

    document.getElementById('tier1').className = (qty >= 10 && qty < 100) ? 'active' : '';
    document.getElementById('tier2').className = (qty >= 100 && qty < 500) ? 'active' : '';
    document.getElementById('tier3').className = (qty >= 500) ? 'active' : '';

    const price = getUnitPrice(qty);
    document.getElementById('unitPrice').innerText = `Цена: ${price} ₽ за шт.`;
    document.getElementById('totalSum').innerText = (qty * price) + ' ₽';
  }

  function handlePay(e) {
    e.preventDefault();
    const qty = parseInt(document.getElementById('qty').value);
    const email = document.getElementById('email').value.trim();

    if (qty > maxAllowed) {
      alert(`Нельзя заказать больше ${maxAllowed} шт.!`);
      return;
    }

    const pricePerUnit = getUnitPrice(qty);
    const total = qty * pricePerUnit;
    const orderId = `${qty}_${email}_${Date.now()}`;

    const payUrl = `https://primepayments.ru/payment/?action=init&project=${PROJECT_ID}&sum=${total}&order=${encodeURIComponent(orderId)}&email=${encodeURIComponent(email)}&currency=RUB`;

    window.location.href = payUrl;
  }

  fetchStock();
</script>

</body>
</html>
