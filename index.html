<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Покупка почтовых аккаунтов</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background: #1e293b; border-radius: 16px; padding: 32px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid #334155; }
    h1 { font-size: 22px; margin-bottom: 8px; text-align: center; }
    .sub { color: #94a3b8; font-size: 14px; text-align: center; margin-bottom: 20px; }
    .tiers { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; margin-bottom: 20px; font-size: 13px; color: #94a3b8; }
    .tiers div { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .tiers div:last-child { margin-bottom: 0; }
    .tiers .active { color: #38bdf8; font-weight: bold; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 8px; }
    input[type="number"], input[type="email"] { width: 100%; height: 44px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; padding: 0 12px; font-size: 15px; outline: none; }
    input[type="number"]:focus, input[type="email"]:focus { border-color: #38bdf8; }
    .price-info { background: #334155; color: #38bdf8; text-align: center; padding: 8px; border-radius: 8px; font-weight: 600; margin-bottom: 20px; font-size: 14px; }
    .total { font-size: 18px; font-weight: 700; display: flex; justify-content: space-between; margin-bottom: 24px; }
    .btn-buy { width: 100%; height: 50px; background: #0284c7; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-buy:hover { background: #0369a1; }
  </style>
</head>
<body>

<div class="card">
  <h1>Почтовые аккаунты</h1>
  <p class="sub">Автоматическая выдача сразу после оплаты</p>

  <div class="tiers">
    <div id="tier1"><span>10 – 99 шт.:</span> <span>25 ₽ / шт.</span></div>
    <div id="tier2"><span>100 – 499 шт.:</span> <span>20 ₽ / шт.</span></div>
    <div id="tier3"><span>от 500 шт.:</span> <span>15 ₽ / шт.</span></div>
  </div>

  <form id="payForm" onsubmit="handlePay(event)">
    <div class="form-group">
      <label>Количество почт (минимум 10)</label>
      <input type="number" id="qty" value="10" min="10" oninput="calculatePrice()">
    </div>

    <div class="price-info" id="unitPrice">Цена: 25 ₽ за шт.</div>

    <div class="form-group">
      <label>Ваш Email (туда придут аккаунты)</label>
      <input type="email" id="email" placeholder="example@mail.ru" required>
    </div>

    <div class="total">
      <span>Итого к оплате:</span>
      <span id="totalSum">250 ₽</span>
    </div>

    <button type="submit" class="btn-buy">Перейти к оплате</button>
  </form>
</div>

<script>
  // Замени YOUR_PROJECT_ID на ID твоего проекта из личного кабинета кассы
  const PROJECT_ID = "YOUR_PROJECT_ID"; 

  function getUnitPrice(qty) {
    if (qty >= 500) return 15;
    if (qty >= 100) return 20;
    return 25;
  }

  function calculatePrice() {
    const qtyInput = document.getElementById('qty');
    let qty = parseInt(qtyInput.value) || 0;

    // Подсветка активного тарифного плана
    document.getElementById('tier1').className = (qty >= 10 && qty < 100) ? 'active' : '';
    document.getElementById('tier2').className = (qty >= 100 && qty < 500) ? 'active' : '';
    document.getElementById('tier3').className = (qty >= 500) ? 'active' : '';

    const price = getUnitPrice(qty);
    document.getElementById('unitPrice').innerText = `Цена: ${price} ₽ за шт.`;
    document.getElementById('totalSum').innerText = (qty * price) + ' ₽';
  }

  function handlePay(e) {
    e.preventDefault();
    const qty = parseInt(document.getElementById('qty').value);
    const email = document.getElementById('email').value.trim();

    if (qty < 10) {
      alert("Минимальный заказ — 10 штук!");
      return;
    }

    const pricePerUnit = getUnitPrice(qty);
    const total = qty * pricePerUnit;

    // Форматируем передачу данных: КОЛИЧЕСТВО_EMAIL_ВРЕМЯ
    const orderId = `${qty}_${email}_${Date.now()}`;

    // Ссылка на оплату PrimePayments
    const payUrl = `https://primepayments.ru/payment/?action=init&project=${PROJECT_ID}&sum=${total}&order=${encodeURIComponent(orderId)}&email=${encodeURIComponent(email)}&currency=RUB`;

    window.location.href = payUrl;
  }

  calculatePrice();
</script>

</body>
</html>
